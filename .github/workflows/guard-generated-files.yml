name: Guard generated files

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
    # Never create a run for a release-please PR. The job-level author exemption
    # below cannot do this: it is evaluated inside a run, and a GITHUB_TOKEN PR's
    # run is created in action_required and never starts.
    paths-ignore:
      - .release-please-manifest.json
      - CHANGELOG.md

permissions:
  contents: read

concurrency:
  group: guard-generated-files-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: Generated files must not be hand-edited
    runs-on: ubuntu-latest
    # release-please owns CHANGELOG.md and .release-please-manifest.json; its PR
    # is the one legitimate place those files change, so we exempt its author.
    if: >-
      github.event.pull_request.user.login != 'github-actions[bot]' &&
      github.event.pull_request.user.login != 'release-please[bot]'
    steps:
      - uses: actions/checkout@v6
        with:
          # Need history on both sides of the merge-base so `git diff base...head`
          # reflects exactly what GitHub shows as "Files changed".
          fetch-depth: 0

      - name: Reject hand edits or verify an unchanged upstream release import
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          files=$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}")

          violated=""
          for path in CHANGELOG.md .release-please-manifest.json; do
            if printf '%s\n' "$files" | grep -qxF -- "$path"; then
              violated="${violated} ${path}"
            fi
          done

          if [ -n "$violated" ]; then
            # The personal fork may import upstream's release-generated blobs,
            # but only unchanged and as part of a genuinely new release merge.
            if [ "${GITHUB_REPOSITORY:-}" = famlopezmuralles/no-mistakes ]; then
              tag=$(gh api --hostname github.com repos/kunchenguid/no-mistakes/releases/latest \
                --jq 'select(.draft == false and .prerelease == false) | .tag_name')
              [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
                echo "::error::Could not establish the latest stable upstream release" >&2
                exit 1
              }
              release_ref="refs/no-mistakes/upstream-releases/$tag"
              git -c http.https://github.com/.extraheader= fetch --no-tags \
                https://github.com/kunchenguid/no-mistakes.git "refs/tags/$tag:$release_ref"
              release_sha=$(git rev-parse --verify "$release_ref^{commit}")
              if ! git merge-base --is-ancestor "$release_sha" "$BASE_SHA" &&
                 git merge-base --is-ancestor "$release_sha" "$HEAD_SHA"; then
                unchanged=true
                for path in $violated; do
                  expected=$(git rev-parse --verify "$release_sha:$path")
                  proposed=$(git rev-parse --verify "$HEAD_SHA:$path" 2>/dev/null) || proposed=""
                  if [ "$expected" != "$proposed" ]; then
                    unchanged=false
                  fi
                done
                if [ "$unchanged" = true ]; then
                  echo "Verified unchanged generated files from upstream $tag ($release_sha)."
                  exit 0
                fi
              fi
            fi

            {
              echo "::error::This PR modifies release-please-generated files:${violated}"
              echo
              echo "CHANGELOG.md and .release-please-manifest.json are auto-generated by"
              echo "release-please from conventional commits on main. Do not hand-edit them."
              echo
              echo "If you want your change to appear in the next release notes, use a"
              echo "conventional commit message (feat/fix/docs/...). release-please will"
              echo "update these files in the next release PR automatically."
              echo
              echo "See CONTRIBUTING.md for the full contributor workflow."
            } >&2
            exit 1
          fi

          echo "No release-please-generated files modified. OK."
